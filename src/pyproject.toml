[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "economic_indicator_overlay"
version = "0.1.0"
description = "Displays selected Brazilian economic indicators on your desktop and refreshes them at a configurable interval."
readme = "README.md"
authors = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
maintainers = [{name = "Fernando Pujaico Rivera", email = "fernando.pujaico.rivera@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only WITH Classpath-Exception-2.0 OR BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["brazil","economic","widget","indicator","desktop"]
dependencies = [
    "PyQt5",
    "brazilian_economic_data"
]

[project.urls]
"Bug Reports" = "https://github.com/trucomanx-desktop/EconomicIndicatorOverlay/issues"
"Funding" = "https://trucomanx.github.io/en/funding.html"
"Documentation" = "https://github.com/trucomanx-desktop/EconomicIndicatorOverlay/tree/main/doc"
"Source" = "https://github.com/trucomanx-desktop/EconomicIndicatorOverlay"

[project.scripts]
"economic-indicator-overlay" = "economic_indicator_overlay.program:main"

[tool.setuptools]
packages = ["economic_indicator_overlay", "economic_indicator_overlay.modules"]

[tool.setuptools.package-data]
"economic_indicator_overlay" = ["icons/*.png"]
